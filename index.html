<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Budget - 個人財務與待辦管家</title>
    <!-- PWA Manifest 連結 -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4f46e5">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eef2ff',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                        }
                    }
                }
            }
        }
    </script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 min-h-screen flex flex-col md:flex-row transition-colors duration-200">

    <!-- 側邊欄 Sidebar -->
    <aside class="w-full md:w-64 bg-white dark:bg-slate-900 border-b md:border-b-0 md:border-r border-slate-200 dark:border-slate-800 p-4 flex flex-col justify-between shrink-0">
        <div class="space-y-6">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="p-2 bg-indigo-600 text-white rounded-xl">
                        <i data-lucide="wallet" class="w-6 h-6"></i>
                    </div>
                    <span class="font-bold text-lg tracking-wide">My Budget</span>
                </div>
                <button onclick="toggleTheme()" class="md:hidden p-2 rounded-xl text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800">
                    <i data-lucide="sun" class="w-5 h-5 hidden dark:block"></i>
                    <i data-lucide="moon" class="w-5 h-5 block dark:hidden"></i>
                </button>
            </div>

            <!-- 分類選單 -->
            <nav class="space-y-1">
                <button onclick="filterCategory('all')" id="cat-all" class="cat-btn w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl font-medium text-sm transition bg-indigo-50 text-indigo-600 dark:bg-indigo-900/30 dark:text-indigo-400">
                    <i data-lucide="layers" class="w-4 h-4"></i>
                    <span>全部項目</span>
                    <span id="count-all" class="ml-auto text-xs px-2 py-0.5 rounded-full bg-slate-200 dark:bg-slate-800 text-slate-600 dark:text-slate-400">0</span>
                </button>

                <button onclick="filterCategory('shopping')" id="cat-shopping" class="cat-btn w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl font-medium text-sm transition text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800">
                    <i data-lucide="shopping-cart" class="w-4 h-4 text-emerald-500"></i>
                    <span>🛒 待購清單</span>
                    <span id="count-shopping" class="ml-auto text-xs px-2 py-0.5 rounded-full bg-slate-200 dark:bg-slate-800 text-slate-600 dark:text-slate-400">0</span>
                </button>

                <button onclick="filterCategory('bills')" id="cat-bills" class="cat-btn w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl font-medium text-sm transition text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800">
                    <i data-lucide="credit-card" class="w-4 h-4 text-amber-500"></i>
                    <span>💳 待繳費</span>
                    <span id="count-bills" class="ml-auto text-xs px-2 py-0.5 rounded-full bg-slate-200 dark:bg-slate-800 text-slate-600 dark:text-slate-400">0</span>
                </button>

                <button onclick="filterCategory('reminders')" id="cat-reminders" class="cat-btn w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl font-medium text-sm transition text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800">
                    <i data-lucide="bell" class="w-4 h-4 text-rose-500"></i>
                    <span>⏰ 定時提醒</span>
                    <span id="count-reminders" class="ml-auto text-xs px-2 py-0.5 rounded-full bg-slate-200 dark:bg-slate-800 text-slate-600 dark:text-slate-400">0</span>
                </button>

                <button onclick="filterCategory('recurring')" id="cat-recurring" class="cat-btn w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl font-medium text-sm transition text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800">
                    <i data-lucide="repeat" class="w-4 h-4 text-purple-500"></i>
                    <span>🔄 定期繳款</span>
                    <span id="count-recurring" class="ml-auto text-xs px-2 py-0.5 rounded-full bg-slate-200 dark:bg-slate-800 text-slate-600 dark:text-slate-400">0</span>
                </button>
            </nav>
        </div>

        <div class="mt-6 pt-4 border-t border-slate-200 dark:border-slate-800 space-y-2">
            <button onclick="toggleTheme()" class="hidden md:flex w-full items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800">
                <i data-lucide="sun" class="w-4 h-4 hidden dark:block"></i>
                <i data-lucide="moon" class="w-4 h-4 block dark:hidden"></i>
                <span>切換主題模式</span>
            </button>
            <button onclick="exportData()" class="w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800">
                <i data-lucide="download" class="w-4 h-4"></i>
                <span>匯出 JSON 備份</span>
            </button>
        </div>
    </aside>

    <!-- 主要內容區 -->
    <main class="flex-1 p-4 sm:p-8 space-y-6 overflow-y-auto">
        <!-- 頂部與新增按鈕 -->
        <div class="flex flex-col sm:flex-row gap-4 items-stretch sm:items-center justify-between">
            <div class="relative flex-1 max-w-md">
                <i data-lucide="search" class="w-5 h-5 absolute left-3.5 top-3 text-slate-400"></i>
                <input type="text" id="searchInput" oninput="renderItems()" placeholder="搜尋項目名稱..." 
                    class="w-full pl-11 pr-4 py-2.5 rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>

            <button onclick="openModal()" class="px-4 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium rounded-xl transition shadow-lg shadow-indigo-500/20 flex items-center justify-center gap-2">
                <i data-lucide="plus" class="w-4 h-4"></i>
                <span>新增項目</span>
            </button>
        </div>

        <!-- 統計數據卡片 -->
        <div id="statsSummary" class="grid grid-cols-1 sm:grid-cols-3 gap-4">
            <div class="bg-white dark:bg-slate-900 p-4 rounded-2xl border border-slate-200 dark:border-slate-800">
                <span class="text-xs font-semibold text-slate-400">🛒 待購總預算小計</span>
                <div id="statShopping" class="text-xl font-bold text-emerald-500 mt-1">$0</div>
            </div>
            <div class="bg-white dark:bg-slate-900 p-4 rounded-2xl border border-slate-200 dark:border-slate-800">
                <span class="text-xs font-semibold text-slate-400">💳 未繳費總金額</span>
                <div id="statBills" class="text-xl font-bold text-amber-500 mt-1">$0</div>
            </div>
            <div class="bg-white dark:bg-slate-900 p-4 rounded-2xl border border-slate-200 dark:border-slate-800">
                <span class="text-xs font-semibold text-slate-400">🔄 每月固定定期支出</span>
                <div id="statRecurring" class="text-xl font-bold text-purple-500 mt-1">$0</div>
            </div>
        </div>

        <!-- 卡片列表 Grid -->
        <div id="itemsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>

        <!-- 空狀態 -->
        <div id="emptyState" class="hidden flex-col items-center justify-center py-16 text-center space-y-3">
            <div class="p-4 rounded-full bg-slate-100 dark:bg-slate-900 text-slate-400">
                <i data-lucide="inbox" class="w-10 h-10"></i>
            </div>
            <p class="text-slate-500 dark:text-slate-400 font-medium">尚無相關資料項目</p>
            <button onclick="openModal()" class="text-xs text-indigo-500 font-semibold hover:underline">點此立即新增第一筆紀錄</button>
        </div>
    </main>

    <!-- 新增 / 編輯 Modal -->
    <div id="itemModal" class="fixed inset-0 z-50 hidden flex items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4 overflow-y-auto">
        <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl max-w-lg w-full p-6 space-y-6 my-8 shadow-2xl">
            <div class="flex items-center justify-between border-b border-slate-100 dark:border-slate-800 pb-4">
                <h3 class="text-lg font-bold" id="modalTitle">新增資料項目</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <form id="itemForm" onsubmit="saveItem(event)" class="space-y-4">
                <input type="hidden" id="itemId">

                <div>
                    <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">項目分類</label>
                    <select id="itemCategory" onchange="toggleFormFields()" class="w-full px-3.5 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 text-sm focus:outline-none">
                        <option value="shopping">🛒 待購清單 (支援數量與單價)</option>
                        <option value="bills">💳 待繳費 (金額與到期日)</option>
                        <option value="reminders">⏰ 定時提醒 / 待辦</option>
                        <option value="recurring">🔄 定期繳款 (固定週期性支出)</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">名稱 / 描述</label>
                    <input type="text" id="itemName" required class="w-full px-3.5 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 text-sm focus:outline-none">
                </div>

                <!-- 待購動態欄位 -->
                <div id="fieldShopping" class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">數量</label>
                        <input type="number" id="itemQty" value="1" min="1" class="w-full px-3.5 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 text-sm focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">單價預算 ($)</label>
                        <input type="number" id="itemPrice" value="0" min="0" class="w-full px-3.5 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 text-sm focus:outline-none">
                    </div>
                </div>

                <!-- 金額欄位 (待繳費 / 定期繳款) -->
                <div id="fieldAmount">
                    <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">金額 ($)</label>
                    <input type="number" id="itemAmount" value="0" min="0" class="w-full px-3.5 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 text-sm focus:outline-none">
                </div>

                <!-- 到期日欄位 -->
                <div id="fieldDueDate">
                    <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">到期日 / 提醒日期</label>
                    <input type="date" id="itemDueDate" class="w-full px-3.5 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 text-sm focus:outline-none">
                </div>

                <!-- 定期繳款週期欄位 -->
                <div id="fieldCycle">
                    <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">繳款週期</label>
                    <select id="itemCycle" class="w-full px-3.5 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 text-sm focus:outline-none">
                        <option value="monthly">每月一次 (Monthly)</option>
                        <option value="quarterly">每季一次 (Quarterly)</option>
                        <option value="yearly">每年一次 (Yearly)</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">備註說明</label>
                    <textarea id="itemNotes" rows="2" class="w-full px-3.5 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 text-sm focus:outline-none"></textarea>
                </div>

                <div class="flex gap-3 pt-4 border-t border-slate-100 dark:border-slate-800">
                    <button type="button" onclick="closeModal()" class="flex-1 py-2.5 text-sm font-medium text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-xl">取消</button>
                    <button type="submit" class="flex-1 py-2.5 text-sm font-medium bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl shadow-md">儲存</button>
                </div>
            </form>
        </div>
    </div>

    <!-- PWA Service Worker 註冊 -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW registration failed:', err));
            });
        }
    </script>

    <!-- 核心 JS 邏輯 -->
    <script>
        let appData = JSON.parse(localStorage.getItem('my_budget_data')) || [];
        let activeCategory = 'all';

        document.addEventListener('DOMContentLoaded', () => {
            initTheme();
            renderItems();
            lucide.createIcons();
        });

        function initTheme() {
            const theme = localStorage.getItem('my_budget_theme') || 'dark';
            if (theme === 'dark') document.documentElement.classList.add('dark');
            else document.documentElement.classList.remove('dark');
        }

        function toggleTheme() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('my_budget_theme', isDark ? 'dark' : 'light');
        }

        function saveLocal() {
            localStorage.setItem('my_budget_data', JSON.stringify(appData));
        }

        function filterCategory(cat) {
            activeCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(btn => {
                btn.classList.remove('bg-indigo-50', 'text-indigo-600', 'dark:bg-indigo-900/30', 'dark:text-indigo-400');
                btn.classList.add('text-slate-600', 'dark:text-slate-400');
            });
            const btn = document.getElementById(`cat-${cat}`);
            if (btn) btn.classList.add('bg-indigo-50', 'text-indigo-600', 'dark:bg-indigo-900/30', 'dark:text-indigo-400');
            renderItems();
        }

        function toggleFormFields() {
            const cat = document.getElementById('itemCategory').value;
            document.getElementById('fieldShopping').style.display = cat === 'shopping' ? 'grid' : 'none';
            document.getElementById('fieldAmount').style.display = (cat === 'bills' || cat === 'recurring') ? 'block' : 'none';
            document.getElementById('fieldDueDate').style.display = (cat === 'bills' || cat === 'reminders' || cat === 'recurring') ? 'block' : 'none';
            document.getElementById('fieldCycle').style.display = cat === 'recurring' ? 'block' : 'none';
        }

        function openModal() {
            document.getElementById('itemForm').reset();
            document.getElementById('itemId').value = '';
            document.getElementById('modalTitle').innerText = '新增資料項目';
            toggleFormFields();
            document.getElementById('itemModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('itemModal').classList.add('hidden');
        }

        function saveItem(e) {
            e.preventDefault();
            const id = document.getElementById('itemId').value;
            const item = {
                id: id || Date.now().toString(),
                category: document.getElementById('itemCategory').value,
                name: document.getElementById('itemName').value,
                qty: parseInt(document.getElementById('itemQty').value) || 1,
                price: parseFloat(document.getElementById('itemPrice').value) || 0,
                amount: parseFloat(document.getElementById('itemAmount').value) || 0,
                dueDate: document.getElementById('itemDueDate').value || '',
                cycle: document.getElementById('itemCycle').value || 'monthly',
                notes: document.getElementById('itemNotes').value || '',
                completed: false,
                updatedAt: new Date().toLocaleDateString()
            };

            if (id) {
                const idx = appData.findIndex(i => i.id === id);
                if (idx !== -1) appData[idx] = item;
            } else {
                appData.push(item);
            }

            saveLocal();
            closeModal();
            renderItems();
        }

        function toggleComplete(id) {
            const item = appData.find(i => i.id === id);
            if (item) {
                item.completed = !item.completed;
                saveLocal();
                renderItems();
            }
        }

        function deleteItem(id) {
            if (confirm('確定刪除此項目嗎？')) {
                appData = appData.filter(i => i.id !== id);
                saveLocal();
                renderItems();
            }
        }

        function renderItems() {
            const grid = document.getElementById('itemsGrid');
            const search = document.getElementById('searchInput').value.toLowerCase();
            const today = new Date().toISOString().slice(0, 10);

            grid.innerHTML = '';

            // 更新統計金額
            let shopSum = 0, billSum = 0, recurSum = 0;
            appData.forEach(i => {
                if (i.category === 'shopping' && !i.completed) shopSum += (i.qty * i.price);
                if (i.category === 'bills' && !i.completed) billSum += i.amount;
                if (i.category === 'recurring') recurSum += i.amount;
            });
            document.getElementById('statShopping').innerText = `$${shopSum.toLocaleString()}`;
            document.getElementById('statBills').innerText = `$${billSum.toLocaleString()}`;
            document.getElementById('statRecurring').innerText = `$${recurSum.toLocaleString()}`;

            // 分類計數器
            document.getElementById('count-all').innerText = appData.length;
            document.getElementById('count-shopping').innerText = appData.filter(i => i.category === 'shopping').length;
            document.getElementById('count-bills').innerText = appData.filter(i => i.category === 'bills').length;
            document.getElementById('count-reminders').innerText = appData.filter(i => i.category === 'reminders').length;
            document.getElementById('count-recurring').innerText = appData.filter(i => i.category === 'recurring').length;

            const filtered = appData.filter(i => {
                const matchCat = activeCategory === 'all' || i.category === activeCategory;
                const matchSearch = i.name.toLowerCase().includes(search);
                return matchCat && matchSearch;
            });

            if (filtered.length === 0) {
                document.getElementById('emptyState').classList.remove('hidden');
            } else {
                document.getElementById('emptyState').classList.add('hidden');
                filtered.forEach(i => {
                    const card = document.createElement('div');
                    const isOverdue = i.dueDate && i.dueDate < today && !i.completed;

                    card.className = `bg-white dark:bg-slate-900 border ${isOverdue ? 'border-rose-500/80' : 'border-slate-200 dark:border-slate-800'} rounded-2xl p-5 shadow-sm space-y-3 flex flex-col justify-between`;

                    let catBadge = '';
                    if (i.category === 'shopping') catBadge = `<span class="px-2 py-0.5 rounded-full text-xs font-semibold bg-emerald-500/10 text-emerald-500">🛒 待購</span>`;
                    else if (i.category === 'bills') catBadge = `<span class="px-2 py-0.5 rounded-full text-xs font-semibold bg-amber-500/10 text-amber-500">💳 待繳費</span>`;
                    else if (i.category === 'reminders') catBadge = `<span class="px-2 py-0.5 rounded-full text-xs font-semibold bg-rose-500/10 text-rose-500">⏰ 提醒</span>`;
                    else catBadge = `<span class="px-2 py-0.5 rounded-full text-xs font-semibold bg-purple-500/10 text-purple-500">🔄 定期</span>`;

                    card.innerHTML = `
                        <div class="space-y-2">
                            <div class="flex items-start justify-between gap-2">
                                <div class="flex items-center gap-2">
                                    <input type="checkbox" ${i.completed ? 'checked' : ''} onchange="toggleComplete('${i.id}')" class="w-4 h-4 rounded text-indigo-600">
                                    <h4 class="font-bold text-base ${i.completed ? 'line-through text-slate-400' : 'text-slate-900 dark:text-white'}">${escapeHtml(i.name)}</h4>
                                </div>
                                ${catBadge}
                            </div>

                            ${i.category === 'shopping' ? `
                                <div class="text-xs text-slate-500 flex justify-between bg-slate-50 dark:bg-slate-800/40 p-2 rounded-xl">
                                    <span>數量: <strong>${i.qty}</strong> | 單價: $${i.price}</span> <span class="font-bold text-emerald-500">小計: $${(i.qty * i.price).toLocaleString()}</span>
                                </div>
                            ` : ''}

                            ${(i.category === 'bills' || i.category === 'recurring') ? `
                                <div class="text-xs text-slate-500 flex justify-between bg-slate-50 dark:bg-slate-800/40 p-2 rounded-xl">
                                    <span>金額: <strong class="text-amber-500">$${i.amount.toLocaleString()}</strong></span>${i.category === 'recurring' ? `<span class="text-purple-500 font-semibold">週期: ${i.cycle}</span>` : ''}
                                </div>
                            ` : ''}

                            ${i.dueDate ? `
                                <div class="text-xs flex items-center gap-1 ${isOverdue ? 'text-rose-500 font-bold' : 'text-slate-400'}">
                                    <i data-lucide="calendar" class="w-3.5 h-3.5"></i>
                                    <span>到期日: ${i.dueDate}${isOverdue ? '(已逾期)' : ''}</span>
                                </div>
                            ` : ''}

                            ${i.notes ? `<p class="text-xs text-slate-400 bg-slate-50 dark:bg-slate-800/20 p-2 rounded-lg">${escapeHtml(i.notes)}</p>` : ''}
                        </div>

                        <div class="flex items-center justify-between pt-2 border-t border-slate-100 dark:border-slate-800 text-xs">
                            <span class="text-slate-400 text-[10px]">${i.updatedAt}</span>
                            <button onclick="deleteItem('${i.id}')" class="text-slate-400 hover:text-rose-500 p-1">
                                <i data-lucide="trash-2" class="w-4 h-4"></i>
                            </button>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            }
            lucide.createIcons();
        }

        function exportData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(appData, null, 2));
            const a = document.createElement('a');
            a.href = dataStr;
            a.download = `MyBudget_Backup_${new Date().toISOString().slice(0,10)}.json`;
            a.click();
        }

        function escapeHtml(str) {
            return (str || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
