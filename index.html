<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="htmlTitle">智慧個人記帳本</title>
  <!-- Tailwind CSS & Icons & Chart.js & QR Scanner -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 50: '#f0f9ff', 100: '#e0f2fe', 500: '#0284c7', 600: '#0369a1', 700: '#075985' }
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body { -webkit-tap-highlight-color: transparent; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen transition-colors duration-200">

  <!-- PIN 碼解鎖遮罩 -->
  <div id="pinLockScreen" class="fixed inset-0 bg-slate-900 z-50 flex flex-col items-center justify-center p-4 space-y-6 hidden">
    <div class="text-center space-y-2">
      <div class="w-16 h-16 bg-brand-500 rounded-2xl mx-auto flex items-center justify-center text-3xl shadow-lg">
        <i class="fa-solid fa-lock"></i>
      </div>
      <h2 class="text-xl font-bold" id="pinScreenTitle">請輸入 4 位數 PIN 碼</h2>
      <p class="text-xs text-slate-400" id="pinScreenSub">解鎖智慧個人記帳本</p>
    </div>

    <div class="flex gap-4 my-2">
      <div class="pin-dot w-4 h-4 rounded-full border-2 border-slate-600"></div>
      <div class="pin-dot w-4 h-4 rounded-full border-2 border-slate-600"></div>
      <div class="pin-dot w-4 h-4 rounded-full border-2 border-slate-600"></div>
      <div class="pin-dot w-4 h-4 rounded-full border-2 border-slate-600"></div>
    </div>

    <div class="grid grid-cols-3 gap-4 w-64">
      <button onclick="pressPin('1')" class="h-14 rounded-2xl bg-slate-800 hover:bg-slate-700 text-xl font-bold active:scale-95 transition">1</button>
      <button onclick="pressPin('2')" class="h-14 rounded-2xl bg-slate-800 hover:bg-slate-700 text-xl font-bold active:scale-95 transition">2</button>
      <button onclick="pressPin('3')" class="h-14 rounded-2xl bg-slate-800 hover:bg-slate-700 text-xl font-bold active:scale-95 transition">3</button>
      <button onclick="pressPin('4')" class="h-14 rounded-2xl bg-slate-800 hover:bg-slate-700 text-xl font-bold active:scale-95 transition">4</button>
      <button onclick="pressPin('5')" class="h-14 rounded-2xl bg-slate-800 hover:bg-slate-700 text-xl font-bold active:scale-95 transition">5</button>
      <button onclick="pressPin('6')" class="h-14 rounded-2xl bg-slate-800 hover:bg-slate-700 text-xl font-bold active:scale-95 transition">6</button>
      <button onclick="pressPin('7')" class="h-14 rounded-2xl bg-slate-800 hover:bg-slate-700 text-xl font-bold active:scale-95 transition">7</button>
      <button onclick="pressPin('8')" class="h-14 rounded-2xl bg-slate-800 hover:bg-slate-700 text-xl font-bold active:scale-95 transition">8</button>
      <button onclick="pressPin('9')" class="h-14 rounded-2xl bg-slate-800 hover:bg-slate-700 text-xl font-bold active:scale-95 transition">9</button>
      <div></div>
      <button onclick="pressPin('0')" class="h-14 rounded-2xl bg-slate-800 hover:bg-slate-700 text-xl font-bold active:scale-95 transition">0</button>
      <button onclick="clearPin()" class="h-14 rounded-2xl bg-slate-800 hover:bg-slate-700 text-slate-400 active:scale-95 transition"><i class="fa-solid fa-delete-left"></i></button>
    </div>
  </div>

  <!-- 頂部導覽列 -->
  <header class="sticky top-0 z-30 bg-slate-800/80 backdrop-blur-md border-b border-slate-700 px-4 py-3 flex justify-between items-center max-w-md mx-auto">
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 rounded-lg bg-brand-500 text-white flex items-center justify-center font-bold">
        <i class="fa-solid fa-wallet"></i>
      </div>
      <div>
        <h1 class="text-base font-bold leading-none" id="headerAppTitle">智慧記帳本</h1>
        <span class="text-[10px] text-slate-400">Personal Expense Tracker</span>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <button id="lockAppBtn" onclick="lockApp()" class="p-2 rounded-lg bg-slate-700 text-slate-300 hover:bg-slate-600 transition hidden" title="鎖定畫面">
        <i class="fa-solid fa-lock text-rose-400"></i>
      </button>
      <button onclick="openSettings()" class="p-2 rounded-lg bg-slate-700 text-slate-300 hover:bg-slate-600 transition" title="設定">
        <i class="fa-solid fa-gear"></i>
      </button>
      <button onclick="toggleTheme()" class="p-2 rounded-lg bg-slate-700 text-slate-300 hover:bg-slate-600 transition" title="切換主題">
        <i id="themeIcon" class="fa-solid fa-sun text-amber-400"></i>
      </button>
    </div>
  </header>

  <!-- 主要內容區 -->
  <main class="max-w-md mx-auto p-4 pb-28 space-y-4">

    <!-- 本月概況與預算卡片 -->
    <div class="bg-gradient-to-br from-brand-600 to-brand-700 text-white p-5 rounded-2xl shadow-lg relative overflow-hidden space-y-3">
      <div class="flex justify-between items-center text-brand-100 text-xs">
        <span id="lblNetBalance">本月結餘 (NT$)</span>
        <span id="currentMonthLabel">2026 年 10 月</span>
      </div>
      <div class="text-3xl font-extrabold" id="netBalance">$0</div>
      
      <div class="grid grid-cols-2 gap-2 pt-2 border-t border-white/20 text-sm">
        <div>
          <div class="text-brand-100 text-xs" id="lblTotalIncome">總收入</div>
          <div class="font-bold text-emerald-300" id="totalIncome">+$0</div>
        </div>
        <div>
          <div class="text-brand-100 text-xs" id="lblTotalExpense">總支出</div>
          <div class="font-bold text-rose-300" id="totalExpense">-$0</div>
        </div>
      </div>

      <!-- 每月預算進度條 -->
      <div class="pt-2 border-t border-white/10 space-y-1">
        <div class="flex justify-between text-[11px] text-brand-100">
          <span id="lblBudgetProgress">每月預算使用進度</span>
          <span id="budgetUsageText">$0 / $30,000 (0%)</span>
        </div>
        <div class="w-full bg-black/20 h-2 rounded-full overflow-hidden">
          <div id="budgetBar" class="bg-emerald-400 h-full transition-all duration-300" style="width: 0%"></div>
        </div>
      </div>
    </div>

    <!-- 功能標籤選單 -->
    <div class="flex bg-slate-800 p-1 rounded-xl text-sm font-medium border border-slate-700">
      <button onclick="switchTab('transactions')" id="tab-transactions" class="flex-1 py-2 rounded-lg bg-slate-700 text-white shadow-sm text-center">明細列表</button>
      <button onclick="switchTab('analytics')" id="tab-analytics" class="flex-1 py-2 rounded-lg text-slate-400 text-center">圖表統計</button>
      <button onclick="switchTab('voice')" id="tab-voice" class="flex-1 py-2 rounded-lg text-slate-400 text-center flex items-center justify-center gap-1">
        <i class="fa-solid fa-microphone text-rose-400"></i> <span id="lblTabVoice">語音記帳</span>
      </button>
    </div>

    <!-- 頁面 1: 交易明細 -->
    <section id="view-transactions" class="space-y-3">
      <div class="bg-slate-800 p-3 rounded-xl border border-slate-700 space-y-2">
        <div class="flex gap-2">
          <div class="relative flex-1">
            <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-xs text-slate-400"></i>
            <input type="text" id="searchInput" oninput="renderTransactions()" placeholder="搜尋關鍵字、分類或備註..." class="w-full bg-slate-700 pl-8 pr-3 py-1.5 rounded-lg text-sm outline-none focus:ring-2 focus:ring-brand-500">
          </div>
          <select id="typeFilter" onchange="renderTransactions()" class="bg-slate-700 px-2 py-1.5 rounded-lg text-sm outline-none">
            <option value="ALL" id="optAllType">全部收支</option>
            <option value="EXPENSE" id="optExpenseType">支出</option>
            <option value="INCOME" id="optIncomeType">收入</option>
          </select>
        </div>
        <div class="flex items-center justify-between text-xs text-slate-400 pt-1">
          <label class="flex items-center gap-2 cursor-pointer">
            <input type="checkbox" id="invoiceOnlyFilter" onchange="renderTransactions()" class="rounded bg-slate-700 border-slate-600">
            <span id="lblInvoiceOnly">僅顯示有發票/載具紀錄 (方便對獎)</span>
          </label>
          <span id="filteredCount" class="text-[11px] bg-slate-700 px-2 py-0.5 rounded-full text-slate-300">0 筆</span>
        </div>
      </div>

      <div id="transactionList" class="space-y-2"></div>
    </section>

    <!-- 頁面 2: 統計圖表 -->
    <section id="view-analytics" class="hidden space-y-4">
      <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 space-y-3">
        <h3 class="font-bold text-sm text-slate-200" id="lblChartTitle">支出分類佔比</h3>
        <div class="h-60 relative flex items-center justify-center">
          <canvas id="categoryChart"></canvas>
        </div>
      </div>
    </section>

    <!-- 頁面 3: 語音/文字 AI 記帳 -->
    <section id="view-voice" class="hidden space-y-4">
      <div class="bg-slate-800 p-5 rounded-2xl border border-slate-700 text-center space-y-4">
        <div class="w-20 h-20 mx-auto rounded-full bg-rose-500/20 border border-rose-500/30 text-rose-400 flex items-center justify-center text-3xl shadow-lg cursor-pointer hover:scale-105 transition" onclick="startVoiceInput()">
          <i class="fa-solid fa-microphone"></i>
        </div>
        <div>
          <h3 class="font-bold" id="lblVoiceTitle">點擊按鈕開始語音記帳</h3>
          <p class="text-xs text-slate-400 mt-1" id="lblVoiceSub">請用自然的說話習慣記帳：</p>
          <div class="text-xs bg-slate-900/60 p-2 rounded-lg text-slate-300 font-mono mt-2" id="lblVoiceExample">
            「今天午餐吃拉麵花了 220 元用現金付 發票號碼 AB12345678」
          </div>
        </div>

        <div id="voiceStatus" class="text-xs font-mono bg-slate-900 p-3 rounded-lg min-h-[45px] flex items-center justify-center text-slate-400 border border-slate-700">
          準備就緒，請點擊上方麥克風發言...
        </div>

        <!-- 備援：自然語言文字輸入 -->
        <div class="pt-3 border-t border-slate-700 space-y-2 text-left">
          <label class="text-xs text-slate-400" id="lblAiInputLabel">不方便說話？用打字的也能 AI 記帳：</label>
          <div class="flex gap-2">
            <input type="text" id="aiTextInput" placeholder="例如: 晚餐 180 元 現金" class="flex-1 bg-slate-700 px-3 py-2 rounded-xl text-sm outline-none focus:ring-2 focus:ring-brand-500">
            <button onclick="processAITextInput()" class="bg-brand-500 hover:bg-brand-600 text-white font-bold px-4 rounded-xl text-sm transition" id="btnSendAi">發送</button>
          </div>
        </div>
      </div>
    </section>

  </main>

  <!-- 底部固定新增按鈕 -->
  <div class="fixed bottom-4 left-0 right-0 max-w-md mx-auto px-4 z-20">
    <button onclick="openModal()" class="w-full bg-brand-500 hover:bg-brand-600 text-white font-bold py-3.5 rounded-2xl shadow-xl flex items-center justify-center gap-2 active:scale-95 transition">
      <i class="fa-solid fa-plus"></i> <span id="btnAddRecord">新增一筆紀錄</span>
    </button>
  </div>

  <!-- 新增/編輯彈窗 -->
  <div id="modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-slate-800 border border-slate-700 w-full max-w-md rounded-t-3xl sm:rounded-2xl p-5 space-y-4 max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center border-b border-slate-700 pb-2">
        <h3 class="font-bold text-slate-100" id="modalTitle">新增交易紀錄</h3>
        <button onclick="closeModal()" class="text-slate-400 hover:text-slate-200"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>

      <form id="txForm" onsubmit="saveTransaction(event)" class="space-y-3">
        <input type="hidden" id="editTxId" value="">
        <div class="grid grid-cols-2 gap-2">
          <label class="flex items-center justify-center p-2.5 rounded-xl bg-slate-700 has-[:checked]:bg-rose-500 text-slate-300 has-[:checked]:text-white cursor-pointer text-sm font-bold">
            <input type="radio" name="type" value="EXPENSE" checked class="hidden" onchange="updateCategories()"><span id="lblTypeExpense">支出</span>
          </label>
          <label class="flex items-center justify-center p-2.5 rounded-xl bg-slate-700 has-[:checked]:bg-emerald-500 text-slate-300 has-[:checked]:text-white cursor-pointer text-sm font-bold">
            <input type="radio" name="type" value="INCOME" class="hidden" onchange="updateCategories()"><span id="lblTypeIncome">收入</span>
          </label>
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="text-xs text-slate-400" id="lblAmount">金額 (NT$)</label>
            <input type="number" id="txAmount" required placeholder="0" class="w-full bg-slate-700 p-2.5 rounded-xl text-lg font-bold outline-none focus:ring-2 focus:ring-brand-500">
          </div>
          <div>
            <label class="text-xs text-slate-400" id="lblDate">日期</label>
            <input type="date" id="txDate" required class="w-full bg-slate-700 p-2.5 rounded-xl text-sm outline-none">
          </div>
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="text-xs text-slate-400" id="lblCategory">分類</label>
            <select id="txCategory" class="w-full bg-slate-700 p-2.5 rounded-xl text-sm outline-none"></select>
          </div>
          <div>
            <label class="text-xs text-slate-400" id="lblAccount">帳戶</label>
            <select id="txAccount" class="w-full bg-slate-700 p-2.5 rounded-xl text-sm outline-none"></select>
          </div>
        </div>

        <div>
          <div class="flex justify-between items-center mb-1">
            <label class="text-xs text-slate-400" id="lblInvoice">發票號碼 / 載具 (選填)</label>
            <button type="button" onclick="startScanner()" class="text-xs text-brand-500 hover:text-brand-400 font-bold flex items-center gap-1">
              <i class="fa-solid fa-camera"></i> <span id="btnScanInvoice">掃描發票/條碼</span>
            </button>
          </div>
          <input type="text" id="txInvoice" placeholder="如: AB12345678" class="w-full bg-slate-700 p-2.5 rounded-xl text-sm outline-none uppercase font-mono">
        </div>

        <div>
          <label class="text-xs text-slate-400" id="lblNote">備註說明</label>
          <input type="text" id="txNote" placeholder="例如：午餐牛肉麵" class="w-full bg-slate-700 p-2.5 rounded-xl text-sm outline-none">
        </div>

        <button type="submit" class="w-full bg-brand-500 hover:bg-brand-600 text-white font-bold py-3 rounded-xl shadow mt-2 transition" id="btnSaveTx">儲存紀錄</button>
      </form>
    </div>
  </div>

  <!-- 相機掃描條碼 / QR Code 彈窗 -->
  <div id="scannerModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex flex-col items-center justify-center p-4">
    <div class="bg-slate-800 border border-slate-700 w-full max-w-md rounded-2xl p-4 space-y-3 relative">
      <div class="flex justify-between items-center">
        <h3 class="font-bold text-sm" id="lblScanTitle">掃描發票條碼 / QR Code</h3>
        <button onclick="stopScanner()" class="text-slate-400 hover:text-slate-200"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>
      <div id="qr-reader" class="overflow-hidden rounded-xl bg-black min-h-[250px]"></div>
      <p class="text-[11px] text-center text-slate-400" id="lblScanDesc">將相機對準電子發票 QR Code 或紙本條碼即可自動對焦解析</p>
    </div>
  </div>

  <!-- 設定與資料備份彈窗 -->
  <div id="settingsModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-slate-800 border border-slate-700 w-full max-w-md rounded-t-3xl sm:rounded-2xl p-5 space-y-4 max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center border-b border-slate-700 pb-2">
        <h3 class="font-bold text-slate-100" id="lblSettingsTitle">偏好設定與資料備份</h3>
        <button onclick="closeSettings()" class="text-slate-400 hover:text-slate-200"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>

      <div class="space-y-4 text-sm">
        <div>
          <label class="text-xs text-slate-400" id="lblLanguage">語言設定 (Language)</label>
          <select id="langSelect" onchange="changeLanguage(this.value)" class="w-full bg-slate-700 p-2.5 rounded-xl text-sm outline-none mt-1">
            <option value="zh-TW">繁體中文</option>
            <option value="en">English</option>
          </select>
        </div>

        <div>
          <label class="text-xs text-slate-400" id="lblMonthlyBudget">每月總預算 (NT$)</label>
          <div class="flex gap-2 mt-1">
            <input type="number" id="monthlyBudgetInput" class="flex-1 bg-slate-700 p-2 rounded-xl text-sm outline-none">
            <button onclick="saveBudgetSetting()" class="bg-brand-500 px-3 py-2 rounded-xl font-bold" id="btnSaveBudget">儲存</button>
          </div>
        </div>

        <div class="pt-3 border-t border-slate-700 space-y-2">
          <label class="text-xs text-slate-400" id="lblPinTitle">4 位數 PIN 碼安全解鎖鎖定</label>
          <div class="flex gap-2">
            <input type="password" id="pinInput" maxlength="4" placeholder="設定 4 位數 PIN 碼" class="flex-1 bg-slate-700 p-2 rounded-xl text-sm outline-none text-center tracking-widest">
            <button onclick="savePinSetting()" class="bg-brand-500 px-3 py-2 rounded-xl font-bold" id="btnSetPin">設定 PIN 碼</button>
            <button onclick="removePinSetting()" class="bg-rose-600 px-3 py-2 rounded-xl font-bold text-xs" id="btnClearPin">清除</button>
          </div>
        </div>

        <div class="pt-3 border-t border-slate-700 space-y-2">
          <label class="text-xs text-slate-400" id="lblBackupTitle">資料備份與匯出</label>
          <div class="grid grid-cols-2 gap-2">
            <button onclick="exportCSV()" class="bg-slate-700 hover:bg-slate-600 p-2.5 rounded-xl flex items-center justify-center gap-1 text-xs">
              <i class="fa-solid fa-file-csv text-emerald-400"></i> <span id="btnExportCsv">匯出 CSV 報表</span>
            </button>
            <button onclick="exportBackupJSON()" class="bg-slate-700 hover:bg-slate-600 p-2.5 rounded-xl flex items-center justify-center gap-1 text-xs">
              <i class="fa-solid fa-download text-sky-400"></i> <span id="btnBackupJson">備份 JSON</span>
            </button>
          </div>
          <label class="block bg-slate-700 hover:bg-slate-600 p-2.5 rounded-xl text-center text-xs cursor-pointer border border-dashed border-slate-500">
            <i class="fa-solid fa-upload text-amber-400 mr-1"></i> <span id="btnRestoreJson">還原 JSON 備份檔</span>
            <input type="file" accept=".json" onchange="importBackupJSON(event)" class="hidden">
          </label>
        </div>
      </div>
    </div>
  </div>

  <!-- JavaScript 邏輯碼與多國語言系統 -->
  <script>
    const translations = {
      'zh-TW': {
        app_title: '智慧個人記帳本',
        header_title: '智慧記帳本',
        pin_title: '請輸入 4 位數 PIN 碼',
        pin_sub: '解鎖智慧個人記帳本',
        net_balance: '本月結餘 (NT$)',
        total_income: '總收入',
        total_expense: '總支出',
        budget_progress: '每月預算使用進度',
        tab_tx: '明細列表',
        tab_analytics: '圖表統計',
        tab_voice: '語音記帳',
        search_placeholder: '搜尋關鍵字、分類或備註...',
        opt_all: '全部收支',
        opt_expense: '支出',
        opt_income: '收入',
        chk_invoice_only: '僅顯示有發票/載具紀錄 (方便對獎)',
        chart_title: '支出分類佔比',
        voice_title: '點擊按鈕開始語音記帳',
        voice_sub: '請用自然的說話習慣記帳：',
        voice_example: '「今天午餐吃拉麵花了 220 元用現金付 發票號碼 AB12345678」',
        voice_ready: '準備就緒，請點擊上方麥克風發言...',
        ai_input_label: '不方便說話？用打字的也能 AI 記帳：',
        ai_input_placeholder: '例如: 晚餐 180 元 現金',
        btn_send: '發送',
        btn_add_record: '新增一筆紀錄',
        modal_title_add: '新增交易紀錄',
        modal_title_edit: '編輯交易紀錄',
        lbl_type_expense: '支出',
        lbl_type_income: '收入',
        lbl_amount: '金額 (NT$)',
        lbl_date: '日期',
        lbl_category: '分類',
        lbl_account: '帳戶',
        lbl_invoice: '發票號碼 / 載具 (選填)',
        btn_scan_invoice: '掃描發票/條碼',
        lbl_note: '備註說明',

    function checkPinLock() {
      if (appConfig.pinCode && appConfig.pinCode.length === 4) {
        document.getElementById('pinLockScreen').classList.remove('hidden');
        document.getElementById('lockAppBtn').classList.remove('hidden');
      } else {
        document.getElementById('pinLockScreen').classList.add('hidden');
        document.getElementById('lockAppBtn').classList.add('hidden');
      }
    }

    function pressPin(num) {
      if (enteredPin.length < 4) {
        enteredPin += num;
        updatePinDots();
        if (enteredPin.length === 4) {
          setTimeout(() => {
            if (enteredPin === appConfig.pinCode) {
              document.getElementById('pinLockScreen').classList.add('hidden');
              enteredPin = '';
              updatePinDots();
            } else {
              alert(getCurrentLanguage() === 'zh-TW' ? 'PIN 碼錯誤！請重新輸入。' : 'Incorrect PIN! Please try again.');
              clearPin();
            }
          }, 100);
        }
      }
    }

    function clearPin() {
      enteredPin = '';
      updatePinDots();
    }

    function updatePinDots() {
      const dots = document.querySelectorAll('.pin-dot');
      dots.forEach((dot, idx) => {
        if (idx < enteredPin.length) {
          dot.classList.add('bg-brand-500', 'border-brand-500');
        } else {
          dot.classList.remove('bg-brand-500', 'border-brand-500');
        }
      });
    }

    function lockApp() {
      if (appConfig.pinCode) {
        clearPin();
        document.getElementById('pinLockScreen').classList.remove('hidden');
      }
    }

    function savePinSetting() {
      const val = document.getElementById('pinInput').value.trim();
      if (val.length === 4 && /^\d+$/.test(val)) {
        appConfig.pinCode = val;
        localStorage.setItem('app_config', JSON.stringify(appConfig));
        checkPinLock();
        closeSettings();
        alert(getCurrentLanguage() === 'zh-TW' ? 'PIN 碼設定成功！' : 'PIN set successfully!');
      } else {
        alert(getCurrentLanguage() === 'zh-TW' ? '請輸入 4 位純數字 PIN 碼。' : 'Please enter a 4-digit PIN.');
      }
    }

    function removePinSetting() {
      appConfig.pinCode = '';
      localStorage.setItem('app_config', JSON.stringify(appConfig));
      document.getElementById('pinInput').value = '';
      checkPinLock();
      closeSettings();
      alert(getCurrentLanguage() === 'zh-TW' ? '已解除 PIN 碼鎖定。' : 'PIN lock removed.');

    function saveBudgetSetting() {
      const val = Number(document.getElementById('monthlyBudgetInput').value);

        appConfig.monthlyBudget = val;
        localStorage.setItem('app_config', JSON.stringify(appConfig));
        renderTransactions();
        closeSettings();
        alert(getCurrentLanguage() === 'zh-TW' ? '預算設定已儲存！' : 'Budget saved!');

      document.documentElement.classList.toggle('dark');
      const isDark = document.documentElement.classList.contains('dark');
      document.body.className = isDark ? 'bg-slate-900 text-slate-100 min-h-screen transition-colors duration-200' : 'bg-slate-50 text-slate-800 min-h-screen transition-colors duration-200';
      document.getElementById('themeIcon').className = isDark ? 'fa-solid fa-sun text-amber-400' : 'fa-solid fa-moon text-slate-600';
    }

    function updateCategoriesAndAccounts() {
      const typeRadio = document.querySelector('input[name="type"]:checked');
      const type = typeRadio ? typeRadio.value : 'EXPENSE';
      const lang = getCurrentLanguage();
      const dict = translations[lang] || translations['en'];

      const catSelect = document.getElementById('txCategory');
      if (catSelect) {
        catSelect.innerHTML = dict.cats[type].map(c => `<option value="${c}">${c}</option>`).join('');
      }

      const accSelect = document.getElementById('txAccount');
      if (accSelect) {
        accSelect.innerHTML = dict.accs.map(a => `<option value="${a}">${a}</option>`).join('');
      }
    }

    function updateCategories() { updateCategoriesAndAccounts(); }

    function renderTransactions() {
      const list = document.getElementById('transactionList');
      const searchInput = document.getElementById('searchInput');
      const search = searchInput ? searchInput.value.toLowerCase() : '';
      const typeFilter = document.getElementById('typeFilter');
      const type = typeFilter ? typeFilter.value : 'ALL';
      const invoiceOnlyFilter = document.getElementById('invoiceOnlyFilter');
      const invoiceOnly = invoiceOnlyFilter ? invoiceOnlyFilter.checked : false;

      let filtered = transactions.filter(t => {
        const matchSearch = (t.note && t.note.toLowerCase().includes(search)) || (t.category && t.category.toLowerCase().includes(search)) || (t.invoice && t.invoice.toLowerCase().includes(search));
        const matchType = type === 'ALL' || t.type === type;
        const matchInvoice = !invoiceOnly || (t.invoice && t.invoice.trim() !== '');
        return matchSearch && matchType && matchInvoice;
      });

      document.getElementById('filteredCount').innerText = `${filtered.length} ${getCurrentLanguage() === 'zh-TW' ? '筆' : 'items'}`;

      let inc = 0, exp = 0;
      transactions.forEach(t => t.type === 'INCOME' ? inc += Number(t.amount) : exp += Number(t.amount));
      document.getElementById('totalIncome').innerText = `+$${inc.toLocaleString()}`;
      document.getElementById('totalExpense').innerText = `-$${exp.toLocaleString()}`;
      document.getElementById('netBalance').innerText = `$${(inc - exp).toLocaleString()}`;

      const budget = appConfig.monthlyBudget || 1;
      const pct = Math.min(Math.round((exp / budget) * 100), 100);
      document.getElementById('budgetUsageText').innerText = `$${exp.toLocaleString()} / $${budget.toLocaleString()} (${pct}%)`;
      const bar = document.getElementById('budgetBar');
      bar.style.width = `${pct}%`;
      bar.className = pct > 90 ? 'bg-rose-500 h-full transition-all duration-300' : pct > 75 ? 'bg-amber-400 h-full transition-all duration-300' : 'bg-emerald-400 h-full transition-all duration-300';

      if(filtered.length === 0) {
        list.innerHTML = `<div class="text-center py-10 text-slate-500 text-sm">${t('no_records')}</div>`;
        return;
      }

      list.innerHTML = filtered.map(t => `
        <div class="bg-slate-800 p-3.5 rounded-xl border border-slate-700 flex justify-between items-center">
          <div class="space-y-1">
            <div class="flex items-center gap-2">
              <span class="font-bold text-sm">${t.category}</span>
              <span class="text-[10px] px-1.5 py-0.5 rounded bg-slate-700 text-slate-300">${t.account}</span>
              ${t.invoice ? `<span class="text-[10px] px-1.5 py-0.5 rounded bg-amber-500/20 text-amber-400 font-mono"><i class="fa-solid fa-receipt"></i> ${t.invoice}</span>` : ''}
            </div>
            <div class="text-xs text-slate-400">${t.date} ${t.note ? '• ' + t.note : ''}</div>
          </div>
          <div class="text-right">
            <div class="font-bold ${t.type === 'INCOME' ? 'text-emerald-400' : 'text-slate-100'}">
              ${t.type === 'INCOME' ? '+' : '-'}$${Number(t.amount).toLocaleString()}
            </div>
            <div class="flex gap-2 justify-end mt-1 text-xs text-slate-400">
              <button onclick="editTx('${t.id}')" class="hover:text-sky-400"><i class="fa-solid fa-pen-to-square"></i></button>
              <button onclick="deleteTx('${t.id}')" class="hover:text-rose-400"><i class="fa-solid fa-trash-can"></i></button>
            </div>
          </div>
        </div>
      `).join('');

      updateChartData();
    }

    function saveTransaction(e) {
      e.preventDefault();
      const id = document.getElementById('editTxId').value || Date.now().toString();
      const newTx = {
        id: id,
        type: document.querySelector('input[name="type"]:checked').value,
        amount: Number(document.getElementById('txAmount').value),
        date: document.getElementById('txDate').value,
        category: document.getElementById('txCategory').value,
        account: document.getElementById('txAccount').value,
        invoice: document.getElementById('txInvoice').value.trim().toUpperCase(),
        note: document.getElementById('txNote').value.trim()
      };

      const idx = transactions.findIndex(t => t.id === id);
      if (idx >= 0) transactions[idx] = newTx;
      else transactions.unshift(newTx);

      localStorage.setItem('app_txs', JSON.stringify(transactions));
      closeModal();
      renderTransactions();
    }

    function editTx(id) {
      const tx = transactions.find(x => x.id === id);
      if (!tx) return;
      document.getElementById('editTxId').value = tx.id;
      document.getElementById('modalTitle').innerText = t('modal_title_edit');
      document.querySelector(`input[name="type"][value="${tx.type}"]`).checked = true;
      updateCategoriesAndAccounts();
      document.getElementById('txAmount').value = tx.amount;
      document.getElementById('txDate').value = tx.date;
      document.getElementById('txCategory').value = tx.category;
      document.getElementById('txAccount').value = tx.account;
      document.getElementById('txInvoice').value = tx.invoice || '';
      document.getElementById('txNote').value = tx.note || '';
      openModal();
    }

    function deleteTx(id) {
      const confirmMsg = getCurrentLanguage() === 'zh-TW' ? '確定要刪除這筆紀錄嗎？' : 'Are you sure you want to delete this record?';
      if(confirm(confirmMsg)) {
        transactions = transactions.filter(t => t.id !== id);
        localStorage.setItem('app_txs', JSON.stringify(transactions));
        renderTransactions();
      }
    }

      if(!document.getElementById('editTxId').value) {
        document.getElementById('modalTitle').innerText = t('modal_title_add');
        document.getElementById('txForm').reset();
        document.getElementById('txDate').value = new Date().toISOString().split('T')[0];

      }

    function closeModal() {

    function closeSettings() { document.getElementById('settingsModal').classList.add('hidden'); }

    function switchTab(tab) {
      ['transactions', 'analytics', 'voice'].forEach(tKey => {
        document.getElementById(`view-${tKey}`).classList.toggle('hidden', tKey !== tab);
        const btn = document.getElementById(`tab-${tKey}`);
        btn.className = tKey === tab ? 'flex-1 py-2 rounded-lg bg-slate-700 text-white shadow-sm text-center font-bold' : 'flex-1 py-2 rounded-lg text-slate-400 text-center';
      });

    function startScanner() {
      document.getElementById('scannerModal').classList.remove('hidden');
      html5QrCode = new Html5Qrcode("qr-reader");
      html5QrCode.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: { width: 250, height: 250 } },
        (decodedText) => {
          parseScannedData(decodedText);
          stopScanner();
        },
        (errorMessage) => {}
      ).catch(err => {
        alert(getCurrentLanguage() === 'zh-TW' ? '無法開啟相機鏡頭，請確認權限。' : 'Cannot open camera. Check permissions.');
        stopScanner();
      });
    }

    function stopScanner() {
      if (html5QrCode) {
        html5QrCode.stop().then(() => {
          html5QrCode.clear();
          document.getElementById('scannerModal').classList.add('hidden');
        }).catch(err => {
          document.getElementById('scannerModal').classList.add('hidden');
        });
      } else {
        document.getElementById('scannerModal').classList.add('hidden');
      }
    }

    function parseScannedData(text) {
      let inv = '';
      let amt = 0;

      if (text.length >= 10 && /^[A-Z]{2}\d{8}/.test(text)) {
        inv = text.substring(0, 10);
        if (text.length >= 36) {
          const hexAmt = text.substring(29, 37);
          const parsedHex = parseInt(hexAmt, 16);
          if (!isNaN(parsedHex) && parsedHex > 0) amt = parsedHex;
        }
      } else {
        inv = text;
      }

      document.getElementById('txInvoice').value = inv.toUpperCase();
      if (amt > 0) document.getElementById('txAmount').value = amt;
      alert((getCurrentLanguage() === 'zh-TW' ? '掃描成功！已自動填入發票：' : 'Scanned! Invoice: ') + inv + (amt ? ` (Amount: $${amt})` : ''));
    }

    function startVoiceInput() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        alert(getCurrentLanguage() === 'zh-TW' ? '您的瀏覽器不支援語音辨識。' : 'Speech recognition not supported in this browser.');
        return;
      }
      const recognition = new SpeechRecognition();
      recognition.lang = getCurrentLanguage() === 'zh-TW' ? 'zh-TW' : 'en-US';
      document.getElementById('voiceStatus').innerText = getCurrentLanguage() === 'zh-TW' ? '正在聆聽中，請說話...' : 'Listening, please speak...';

      recognition.onresult = function(e) {
        const text = e.results[0][0].transcript;
        document.getElementById('voiceStatus').innerText = (getCurrentLanguage() === 'zh-TW' ? '收到：「' : 'Received: "') + text + '"';
        parseAndAddAI(text);
      };
      recognition.start();
    }

    function processAITextInput() {
      const input = document.getElementById('aiTextInput');
      if (!input.value.trim()) return;
      parseAndAddAI(input.value.trim());
      input.value = '';
    }

    function parseAndAddAI(text) {
      const amtMatch = text.match(/\d+/);
      const invoiceMatch = text.match(/[A-Za-z]{2}\d{8}/);
      if (amtMatch) {
        const amt = Number(amtMatch[0]);
        const inv = invoiceMatch ? invoiceMatch[0].toUpperCase() : '';
        const lang = getCurrentLanguage();
        const dict = translations[lang] || translations['en'];
        const newTx = {
          id: Date.now().toString(),
          type: (text.includes('收入') || text.includes('薪資') || text.includes('income') || text.includes('salary')) ? 'INCOME' : 'EXPENSE',
          amount: amt,
          date: new Date().toISOString().split('T')[0],
          category: dict.cats.EXPENSE[0],
          account: dict.accs[0],
          invoice: inv,
          note: text
        };
        transactions.unshift(newTx);
        localStorage.setItem('app_txs', JSON.stringify(transactions));
        renderTransactions();
        alert(getCurrentLanguage() === 'zh-TW' ? 'AI 已為您新增紀錄！' : 'AI has added the record!');
      } else {
        alert(getCurrentLanguage() === 'zh-TW' ? '無法識別金額，請重新發言或輸入。' : 'Could not detect amount. Please try again.');
      }
    }

    function initChart() {
      const chartEl = document.getElementById('categoryChart');
      if (!chartEl) return;
      const ctx = chartEl.getContext('2d');
      categoryChartObj = new Chart(ctx, {
        type: 'doughnut',
        data: { labels: [], datasets: [{ data: [], backgroundColor: ['#f43f5e', '#3b82f6', '#10b981', '#f59e0b', '#8b5cf6', '#ec4899', '#64748b'] }] },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { color: '#94a3b8', font: { size: 11 } } } } }
      });
    }

    function updateChartData() {
      if (!categoryChartObj) return;
      const catTotals = {};
      transactions.filter(t => t.type === 'EXPENSE').forEach(t => {
        catTotals[t.category] = (catTotals[t.category] || 0) + Number(t.amount);
      });
      categoryChartObj.data.labels = Object.keys(catTotals);
      categoryChartObj.data.datasets[0].data = Object.values(catTotals);
      categoryChartObj.update();
    }

    function exportCSV() {
      let csv = 'ID,Type,Amount,Date,Category,Account,Invoice,Note\n';
      transactions.forEach(t => {
        csv += `"${t.id}","${t.type}",${t.amount},"${t.date}","${t.category}","${t.account}","${t.invoice||''}","${t.note||''}"\n`;
      });
      downloadFile(csv, 'my_budget_export.csv', 'text/csv;charset=utf-8;');
    }

    function exportBackupJSON() {
      const data = JSON.stringify({ config: appConfig, transactions: transactions }, null, 2);
      downloadFile(data, 'my_budget_backup.json', 'application/json');
    }

    function importBackupJSON(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(evt) {
        try {
          const parsed = JSON.parse(evt.target.result);
          if (parsed.transactions) {
            transactions = parsed.transactions;
            localStorage.setItem('app_txs', JSON.stringify(transactions));
          }
          if (parsed.config) {
            appConfig = parsed.config;
            localStorage.setItem('app_config', JSON.stringify(appConfig));
          }
          alert(getCurrentLanguage() === 'zh-TW' ? '備份還原成功！' : 'Backup restored successfully!');
          location.reload();
        } catch(err) {
          alert(getCurrentLanguage() === 'zh-TW' ? '無效的 JSON 備份檔。' : 'Invalid JSON backup file.');
        }
      };
      reader.readAsText(file);
    }

    function downloadFile(content, fileName, mimeType) {
      const blob = new Blob([content], { type: mimeType });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = fileName;
      a.click();
      URL.revokeObjectURL(url);
    }
  </script>
</body>
